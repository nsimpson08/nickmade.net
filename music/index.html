<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="What Nick Simpson is listening to.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="page-music">
  <header class="topbar">
    <a class="wordmark" href="/">Nick<span>Made</span></a>
    <nav>
      <a href="/games/">Games</a>
      <a href="/movies/">Movies</a>
      <a href="/music/" aria-current="page">Music</a>
      <a href="/photography/">Photography</a>
      <a href="/extras/">Extras</a>
    </nav>
  </header>

  <main class="content">
    <header class="page-head">
      <h1>Music</h1>
      <p>What I've got on repeat.</p>
    </header>

    <div class="playlists" id="playlists"></div>
  </main>
  <footer id="site-footer">&copy; 2026 Nick Simpson</footer>
  <script src="playlist.js"></script>
  <script>
    (function () {
      var root = document.getElementById("playlists");
      var box = null, boxName = null; // current group wrapper (see "group" in playlist.js)
      (window.PLAYLISTS || []).forEach(function (pl) {
        var section = document.createElement("section");
        section.className = "playlist";

        if (pl.title) { // the Spotify player shows the playlist's name, so a title is optional
          var h = document.createElement("h2");
          h.textContent = pl.title;
          section.appendChild(h);
        }

        if (pl.description) {
          var p = document.createElement("p");
          p.textContent = pl.description;
          section.appendChild(p);
        }

        var m = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(playlist|album|artist|track)\/([A-Za-z0-9]+)/.exec(pl.url || "");
        if (m) {
          var player = document.createElement("div");
          player.className = "player";
          var f = document.createElement("iframe");
          f.src = "https://open.spotify.com/embed/" + m[1] + "/" + m[2] + "?theme=0";
          f.title = pl.title + " on Spotify";
          f.loading = "lazy";
          f.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
          player.appendChild(f);
          section.appendChild(player);
        } else {
          var soon = document.createElement("p");
          soon.className = "empty";
          soon.textContent = "Playlist coming soon.";
          section.appendChild(soon);
        }

        if (pl.group && pl.group === boxName) {
          box.appendChild(section);
        } else if (pl.group) {
          box = document.createElement("div");
          box.className = "group playlist-group" + (pl.groupStyle === "panel" ? " panel" : "");
          boxName = pl.group;
          var head = document.createElement("div");
          head.className = "group-head";
          var name = document.createElement("span");
          name.className = "group-name";
          name.textContent = pl.group;
          head.appendChild(name);
          if (pl.groupNote) {
            var note = document.createElement("span");
            note.className = "group-note";
            note.textContent = pl.groupNote;
            head.appendChild(note);
          }
          box.appendChild(head);
          box.appendChild(section);
          root.appendChild(box);
        } else {
          box = boxName = null;
          root.appendChild(section);
        }
      });
    })();
  </script>
  <script src="/assets/js/recent.js" data-api="https://api.nickmade.net" data-api-local="http://localhost:8787"></script>
  <script src="/assets/js/recs.js" data-api="https://api.nickmade.net" data-api-local="http://localhost:8787"></script>
  <script src="/changelog/log.js"></script>
  <script src="/assets/js/footer.js"></script>
</body>
</html>
