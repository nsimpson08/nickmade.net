<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography · NickMade</title>
  <meta name="description" content="Photography by Nick Simpson, in full resolution.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="page-photography">
  <header class="topbar">
    <a class="wordmark" href="/">Nick<span>Made</span></a>
    <nav>
      <a href="/games/">Games</a>
      <a href="/movies/">Movies</a>
      <a href="/music/">Music</a>
      <a href="/photography/" aria-current="page">Photography</a>
      <a href="/projects/">Projects</a>
    </nav>
  </header>

  <main>
    <div class="content photo-head">
      <header class="page-head">
        <h1>Photography</h1>
        <p>People, places, things</p>
      </header>
      <div class="photo-controls">
        <div class="layout-toggle" role="group" aria-label="Columns">
          <button type="button" data-cols="1" aria-label="1 column"><i></i></button>
          <button type="button" data-cols="2" aria-label="2 columns"><i></i><i></i></button>
          <button type="button" data-cols="4" aria-label="4 columns"><i></i><i></i><i></i><i></i></button>
        </div>
        <a class="open instagram" id="instagram" hidden target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg>
          <span></span>
        </a>
      </div>
    </div>

    <div class="photos" id="photos" data-cols="1"></div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <img alt="">
    <div class="lightbox-bar">
      <a class="lightbox-download" target="_blank" rel="noopener"></a>
      <span class="lightbox-count"></span>
    </div>
    <button class="lightbox-prev" type="button" aria-label="Previous photo">&larr;</button>
    <button class="lightbox-next" type="button" aria-label="Next photo">&rarr;</button>
    <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
  </div>

  <script src="config.js"></script>
  <script src="photos.js"></script>
  <script src="/assets/js/photos.js"></script>
</body>
</html>
