name = "nickmade-queue"
main = "src/index.js"
compatibility_date = "2024-09-01"
workers_dev = false

# Serves the Worker at https://api.nickmade.net (Cloudflare creates the DNS record and certificate)
routes = [
  { pattern = "api.nickmade.net", custom_domain = true }
]

[vars]
SITE_URL = "https://nickmade.net"
ALLOWED_ORIGINS = "https://nickmade.net,https://www.nickmade.net"
QUEUE_LIMIT = "20"
# Used only if the live movies/list.js can't be read
OWNER_QUEUE_FALLBACK = "0"
# Spotify developer app (developer.spotify.com/dashboard) for the home page's "listening to";
# its Client Secret is a secret: npx wrangler secret put SPOTIFY_CLIENT_SECRET
SPOTIFY_CLIENT_ID = "1c18f59367834eaf9edd982c5858fa9b"
SPOTIFY_REDIRECT = "https://api.nickmade.net/spotify/callback"
# Time zone for Recently Played's "Last played" dates
TIMEZONE = "America/Chicago"

# Refresh of Games' Recently Played and the gamerscore banner from Xbox, every 4 hours (UTC times: 0:00, 4:00, 8:00...),
# plus one at midnight in Chicago for the daily "+XG in the last 24h" snapshot. Midnight in Chicago is 05:00 UTC in
# daylight time and 06:00 UTC in standard time, so both fire and scheduled() skips the one that isn't midnight.
[triggers]
crons = ["0 */4 * * *", "0 5 * * *", "0 6 * * *"]

# Created with: npx wrangler kv namespace create QUEUE  (paste the id it prints)
[[kv_namespaces]]
binding = "QUEUE"
id = "5bfd7017fdc24cef93ca0afbfe6094ee"

# Photos Nick adds on the Photography page in owner mode (Ver 1.4; see src/photos.js): the bucket tools/photos.py
# uploads full-size photos to, served at https://photos.nickmade.net/ (PHOTO_URL; locally worker/.dev.vars points it
# at this Worker's /photos/file/)
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "nickmade-photos"

# Secrets (not stored here): npx wrangler secret put ADMIN_TOKEN  /  SALT  /  OPENXBL_API_KEY  /  SPOTIFY_CLIENT_SECRET
