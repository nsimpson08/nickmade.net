<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nick Made</title>
  <meta name="description" content="Things Nick Simpson has made.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e8573f'/><text x='16' y='22' font-family='Georgia,serif' font-size='18' font-weight='700' text-anchor='middle' fill='white'>n</text></svg>">
  <style>
    :root {
      --bg: #faf8f4;
      --fg: #1c1b19;
      --muted: #6b675f;
      --line: #e4dfd5;
      --card: #ffffff;
      --accent: #e8573f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151412;
        --fg: #efece6;
        --muted: #9a958b;
        --line: #2c2a26;
        --card: #1d1c19;
        --accent: #f06a52;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 18vh 16px 64px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    h1 span { color: var(--accent); }
    .lede { color: var(--muted); margin: 0 0 56px; }
    h2 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .project {
      display: block;
      padding: 20px 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    .project:hover, .project:focus-visible {
      border-color: var(--accent);
      transform: translateY(-2px);
      outline: none;
    }
    .project-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .project-name { font-weight: 600; font-size: 1.1rem; }
    .project-url { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
    .project p { margin: 6px 0 0; color: var(--muted); }
    .arrow { color: var(--accent); }
    footer {
      margin-top: 72px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 420px) {
      .project-head { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Nick made<span>.</span></h1>
    <p class="lede">Things I've built, mostly for fun.</p>

    <h2>Projects</h2>
    <a class="project" href="https://montage.nickmade.net">
      <div class="project-head">
        <span class="project-name">Montage <span class="arrow">&rarr;</span></span>
        <span class="project-url">montage.nickmade.net</span>
      </div>
      <p>Enter an Xbox gamertag, pick recently played games, and get a gameplay montage to look back on.</p>
    </a>

    <footer>&copy; <span id="y">2026</span> Nick Simpson</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
