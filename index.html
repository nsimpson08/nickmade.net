<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NickMade</title>
  <meta name="description" content="Projects, video games, movies, music, and photography from Nick Simpson.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Unbounded:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <main class="home">
    <header class="banner">
      <h1>Nick<span class="made">Made</span></h1>
      <p>Things I build, play, watch, hear, and shoot.</p>
    </header>

    <nav class="tiles" aria-label="Sections">
      <a class="tile photography" href="/photography/">
        <div class="frame"><img src="/assets/gifs/photography.gif" alt="" width="480" height="300"></div>
        <span class="label">Photography <span class="arrow">&rarr;</span></span>
        <span class="sub">Full resolution</span>
      </a>
      <a class="tile games" href="/games/">
        <div class="frame"><img src="/assets/gifs/games.gif" alt="" width="480" height="300"></div>
        <span class="label">Video Games <span class="arrow">&rarr;</span></span>
        <span class="sub">Favorites, reviewed</span>
      </a>
      <a class="tile movies" href="/movies/">
        <div class="frame"><img src="/assets/gifs/movies.gif" alt="" width="480" height="300"></div>
        <span class="label">Movies <span class="arrow">&rarr;</span></span>
        <span class="sub">Favorites, reviewed</span>
      </a>
      <a class="tile music" href="/music/">
        <div class="frame"><img src="/assets/gifs/music.gif" alt="" width="480" height="300"></div>
        <span class="label">Music <span class="arrow">&rarr;</span></span>
        <span class="sub">What I'm listening to</span>
      </a>
      <a class="tile projects" href="/projects/">
        <div class="frame"><img src="/assets/gifs/projects.gif" alt="" width="480" height="300"></div>
        <span class="label">Projects <span class="arrow">&rarr;</span></span>
        <span class="sub">Apps and experiments</span>
      </a>
    </nav>

    <footer>&copy; <span id="y">2026</span> Nick Simpson</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
